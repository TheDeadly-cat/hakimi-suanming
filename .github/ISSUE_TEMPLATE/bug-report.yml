name: Bug report
description: Report a reproducible engineering defect without including private research data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not attach credentials, full backups, identifiable birth data, private notes, or raw browser profiles. Security-sensitive reports should follow SECURITY.md instead of a public issue.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Startup or recovery
        - Chart calculation or research flow
        - Local storage or database generation
        - Backup or restore
        - Offline or Service Worker
        - Accessibility or responsive layout
        - Isolated Ziwei or Western draft
        - Documentation or tooling
        - Other
    validations:
      required: true

  - type: input
    id: release_identity
    attributes:
      label: Release identity
      description: Copy the generation, targetSchema, migrationId, build hash, and read-only state shown by the application. Do not guess.
      placeholder: "legacy-v13 / targetSchema 13 / migrationId null / build ..."
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser name/version, install mode, and whether the app was online or offline.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic or anonymized data. Include the smallest repeatable sequence.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include stable error codes and sanitized logs when available.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: data_impact
    attributes:
      label: Data-safety impact
      description: State whether writes, migration, backup, restore, multiple tabs, old Service Workers, or read-only recovery were involved.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials and identifiable birth, note, attachment, backup, and profile data.
          required: true
