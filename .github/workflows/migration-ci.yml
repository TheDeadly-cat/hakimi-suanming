name: Migration CI

on:
  pull_request:
    paths:
      - ".gitattributes"
      - ".node-version"
      - ".npmrc"
      - "package.json"
      - "package-lock.json"
      - "apps/web/package.json"
      - "apps/web/index.html"
      - "apps/web/pwa-build.ts"
      - "apps/web/public/sw.js"
      - "apps/web/release-protocol.ts"
      - "apps/web/src/bootstrap.ts"
      - "apps/web/src/recovery-main.tsx"
      - "apps/web/src/main.tsx"
      - "apps/web/src/lib/app-boot-*"
      - "apps/web/src/lib/app-version.ts"
      - "apps/web/src/lib/current-release.ts"
      - "apps/web/src/lib/full-backup-worker-client.ts"
      - "apps/web/src/lib/full-backup-worker-client.test.ts"
      - "apps/web/src/lib/full-backup-worker-protocol.ts"
      - "apps/web/src/lib/orphaned-v13-rescue.ts"
      - "apps/web/src/lib/preboot-database-inventory.ts"
      - "apps/web/src/lib/release-database-coordinator.ts"
      - "apps/web/src/lib/release-database-coordinator.test.ts"
      - "apps/web/src/lib/release-controller-takeover-write-fence.ts"
      - "apps/web/src/lib/release-controller-takeover-write-fence.test.ts"
      - "apps/web/src/lib/release-integrity-cache.ts"
      - "apps/web/src/lib/service-worker-*"
      - "apps/web/src/lib/storage-capacity-gate.ts"
      - "apps/web/src/pages/case-library-page.tsx"
      - "apps/web/src/pages/case-library-page.test.tsx"
      - "apps/web/src/pages/orphaned-v13-recovery-page.tsx"
      - "apps/web/src/pwa-build.test.ts"
      - "apps/web/src/pwa-files.test.ts"
      - "apps/web/src/sw-lifecycle.test.ts"
      - "apps/web/playwright.sw-two-generation-fixture-result.ts"
      - "apps/web/playwright.sw-two-generation-fixture-reporter.ts"
      - "apps/web/sw-two-generation-artifact-identity.ts"
      - "apps/web/sw-two-generation-fixture-source-identity.ts"
      - "apps/web/e2e/**"
      - "apps/web/playwright.release-browser-*.ts"
      - "apps/web/playwright.migration-diagnostics.ts"
      - "apps/web/playwright*.config.ts"
      - "apps/web/vite*.ts"
      - "packages/backup/**"
      - "packages/contracts/**"
      - "packages/integrity/**"
      - "packages/storage/**"
      - "docs/release/sw-ab-update-runtime-collector-issuance-candidate-policy.v1.json"
      - "docs/release/sw-ab-update-runtime-collector-issuance-candidate-v1.schema.json"
      - "docs/release/PR6采集器临时签发候选边界-v1-2026-08-28.md"
      - "docs/release/sw-ab-update-candidate-runtime-client-capture-collector-issuance-composition-policy.v1.json"
      - "docs/release/sw-ab-update-candidate-runtime-client-capture-collector-issuance-composition-v1.schema.json"
      - "docs/release/PR6四链离线组合候选边界-v1-2026-08-28.md"
      - "docs/release/sw-ab-update-runtime-derived-evidence-producer-bridge-policy.v1.json"
      - "docs/release/sw-ab-update-runtime-derived-evidence-producer-bridge-v1.schema.json"
      - "docs/release/PR6运行时派生证据生产桥接候选边界-v1-2026-08-28.md"
      - "docs/release/sw-ab-update-candidate-runtime-client-capture-collector-issuance-producer-bridge-composition-policy.v2.json"
      - "docs/release/sw-ab-update-candidate-runtime-client-capture-collector-issuance-producer-bridge-composition-v2.schema.json"
      - "docs/release/PR6生产桥接四链组合候选边界-v2-2026-08-28.md"
      - "scripts/**"
      - ".github/workflows/migration-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-scenarios:
    name: Migration / ${{ matrix.suite }}
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite:
          - cross-schema-upgrade
          - cross-schema-v13-v15
          - cross-schema-v14-v15
          - cross-schema-v13-v16
          - orphaned-v13-recovery
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Record the actual checkout and requested PR identity
        shell: pwsh
        env:
          HAKIMI_MIGRATION_EVIDENCE_DIR: ${{ runner.temp }}/hakimi-migration-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
          REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED_BASE: ${{ github.event.pull_request.base.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          MIGRATION_SUITE: ${{ matrix.suite }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $env:HAKIMI_MIGRATION_EVIDENCE_DIR | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "HAKIMI_MIGRATION_EVIDENCE_DIR=$env:HAKIMI_MIGRATION_EVIDENCE_DIR" -Encoding utf8NoBOM
          $checkoutIdentity = @{
            requestedHead = $env:REQUESTED_HEAD
            requestedBase = $env:REQUESTED_BASE
            workflowSha = $env:WORKFLOW_SHA
            actualCheckout = (git rev-parse HEAD)
            checkoutParents = (git log -1 --format=%P)
            suite = $env:MIGRATION_SUITE
            evidenceClass = 'isolated-synthetic-migration-diagnostic'
            formalReleaseAuthorized = $false
          }
          $checkoutIdentity | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:HAKIMI_MIGRATION_EVIDENCE_DIR 'checkout.json') -Encoding utf8NoBOM
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npx playwright install chrome msedge
      - run: npm run check:release-governance
      - run: node --test scripts/verify-release-governance.test.mjs
      - if: ${{ matrix.suite == 'cross-schema-v13-v16' }}
        run: npm run build:production-v13-to-v16:candidate
      - if: ${{ matrix.suite == 'cross-schema-v13-v16' }}
        run: node scripts/verify-built-release-storage-manifest.mjs tmp/release-config-production-v13-to-v16 --expected-channel candidate
      - if: ${{ matrix.suite == 'cross-schema-upgrade' }}
        run: npm run test:e2e:cross-schema-upgrade
      - if: ${{ matrix.suite == 'cross-schema-v13-v15' }}
        run: npm run test:e2e:cross-schema-v13-v15
      - if: ${{ matrix.suite == 'cross-schema-v14-v15' }}
        run: npm run test:e2e:cross-schema-v14-v15
      - if: ${{ matrix.suite == 'cross-schema-v13-v16' }}
        run: npm run test:e2e:cross-schema-v13-v16
      - if: ${{ matrix.suite == 'orphaned-v13-recovery' }}
        run: npm run test:e2e:orphaned-v13-recovery
      - name: Preserve this isolated suite including failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: migration-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HAKIMI_MIGRATION_EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14

  migration-aggregate:
    name: Complete migration matrix
    if: ${{ always() }}
    needs: migration-scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every independent suite to succeed
        env:
          MIGRATION_RESULT: ${{ needs.migration-scenarios.result }}
        run: test "$MIGRATION_RESULT" = success
